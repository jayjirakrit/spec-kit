schema_version: "1.0"
workflow:
  id: "serichai-sdd"
  name: "Serichai SDD Cycle"
  version: "1.0.0"
  author: "Serichai"
  description: "Runs specify → plan → tasks → implement ⇄ converge with review gates"

requires:
  # 0.8.5 is the first release with engine-side resolution of the
  # ``integration: "auto"`` default. Older versions would treat "auto"
  # as a literal integration key and fail at dispatch.
  speckit_version: ">=0.8.5"
  integrations:
    # The four commands below (specify, plan, tasks, implement) are core
    # spec-kit commands provided by every integration. The list here is an
    # advisory, non-exhaustive compatibility hint following the documented
    # ``any: [...]`` schema -- it is NOT a closed set. The workflow runs
    # against any integration the project was initialized with, including
    # ones not listed below, as long as that integration provides the four
    # core commands referenced in ``steps``.
    any:
    - "alquimia"
    - "claude"
    - "copilot"
    - "gemini"
    - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"
  scope:
    type: string
    default: "full"
    enum: [ "full", "backend-only", "frontend-only" ]

steps:
- id: specify
  command: speckit.specify
  integration: "{{ inputs.integration }}"
  input:
    args: "{{ inputs.spec }}"

- id: review-spec
  type: gate
  message: "Review the generated spec before planning."
  options: [ approve, reject ]
  on_reject: abort

- id: plan
  command: speckit.plan
  integration: "{{ inputs.integration }}"
  input:
    args: "{{ inputs.spec }}"

- id: review-plan
  type: gate
  message: "Review the plan, contracts and design.md (key implementation snippets) before generating tasks."
  options: [ approve, reject ]
  on_reject: abort

- id: tasks
  command: speckit.tasks
  integration: "{{ inputs.integration }}"
  input:
    args: "{{ inputs.spec }}"

# implement → converge, repeated until converge appends nothing and implement
# has checked off every task. implement re-runs quality-engineer each pass, so
# the quality-report.md seen at the gate always reflects the final code.
- id: build
  type: do-while
  max_iterations: 3
  condition: "{{ steps.open_tasks.output.data.open > 0 }}"
  steps:
  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"

  # Counts unchecked "- [ ]" tasks left in tasks.md (converge appends new ones
  # unchecked); also exposes the feature dir for the gate's show_file.
  - id: open_tasks
    type: shell
    output_format: json
    run: >-
      python -c "import json,re,pathlib;
      d=json.load(open('.specify/feature.json'))['feature_directory'];
      t=pathlib.Path(d,'tasks.md').read_text(encoding='utf-8');
      print(json.dumps({'dir':d,'open':len(re.findall(r'^- \[ \]',t,re.M))}))"

- id: review-quality
  type: gate
  message: "Converged. Review quality-report.md (verdict, coverage matrix, findings) and any tasks still open in tasks.md before merging."
  show_file: "{{ steps.open_tasks.output.data.dir }}/quality-report.md"
  options: [ approve, reject ]
  on_reject: abort
